{% extends "base.html" %}


{% block title %}Password Change Successful{% endblock title %}


{% block content %}

<style>
    .notice-wrapper {
        display: flex;
        justify-content: center;
        padding: 3rem 1rem 5rem;
    }

    .notice-card {
        width: 100%;
        max-width: 480px;
        background: var(--cream);
        border: 1px solid var(--rule-heavy);
        box-shadow: 4px 6px 0 rgba(30, 20, 10, 0.12), 1px 2px 0 rgba(30, 20, 10, 0.06);
        padding: 2.8rem 2.6rem 2.4rem;
        position: relative;
        text-align: center;
    }

    .notice-card::before {
        content: '';
        position: absolute;
        top: -3px; left: -3px;
        width: 22px; height: 22px;
        border-top: 3px solid var(--ink);
        border-left: 3px solid var(--ink);
    }

    .notice-card::after {
        content: '';
        position: absolute;
        bottom: -3px; right: -3px;
        width: 22px; height: 22px;
        border-bottom: 3px solid var(--ink);
        border-right: 3px solid var(--ink);
    }

    .notice-kicker {
        font-family: var(--font-mono);
        font-size: 0.62rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--ink-faint);
        display: block;
        margin-bottom: 0.55rem;
    }

    .notice-heading {
        font-family: var(--font-display);
        font-size: 2rem;
        font-weight: 900;
        color: var(--ink);
        letter-spacing: -0.03em;
        line-height: 1.15;
        margin-bottom: 0;
    }

    .notice-rule {
        border: none;
        border-top: 3px double var(--ink);
        margin: 1.1rem auto 1.6rem;
        max-width: 80px;
    }

    .notice-body {
        font-family: var(--font-body);
        font-size: 1.05rem;
        color: var(--ink-mid);
        line-height: 1.75;
        margin-bottom: 0;
    }

    .notice-glyph {
        font-family: var(--font-mono);
        font-size: 2rem;
        color: var(--ink-faint);
        display: block;
        margin-bottom: 1rem;
        letter-spacing: 0.1em;
    }

    @media (max-width: 768px) {
        .notice-card { padding: 2rem 1.4rem; }
        .notice-heading { font-size: 1.6rem; }
    }
</style>

<div class="notice-wrapper">
    <div class="notice-card">
        <span class="notice-glyph">&#10003;</span>
        <span class="notice-kicker">Account Security</span>
        <h1 class="notice-heading">Password Changed</h1>
        <hr class="notice-rule">
        <p class="notice-body">Your password has been updated successfully.</p>
    </div>
</div>

{% endblock content %}
