{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Sign Up{% endblock title %}

{% block content %}

<style>
    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 3rem 1rem 5rem;
    }

    .login-card {
        width: 100%;
        max-width: 480px;
        background: var(--cream);
        border: 1px solid var(--rule-heavy);
        box-shadow: 4px 6px 0 rgba(30, 20, 10, 0.12), 1px 2px 0 rgba(30, 20, 10, 0.06);
        padding: 2.8rem 2.6rem 2.4rem;
        position: relative;
    }

    .login-card::before {
        content: '';
        position: absolute;
        top: -3px; left: -3px;
        width: 22px; height: 22px;
        border-top: 3px solid var(--ink);
        border-left: 3px solid var(--ink);
    }

    .login-card::after {
        content: '';
        position: absolute;
        bottom: -3px; right: -3px;
        width: 22px; height: 22px;
        border-bottom: 3px solid var(--ink);
        border-right: 3px solid var(--ink);
    }

    .login-kicker {
        font-family: var(--font-mono);
        font-size: 0.62rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--ink-faint);
        display: block;
        margin-bottom: 0.55rem;
    }

    .login-heading {
        font-family: var(--font-display);
        font-size: 2.1rem;
        font-weight: 900;
        color: var(--ink);
        letter-spacing: -0.03em;
        line-height: 1.1;
        margin-bottom: 0;
    }

    .login-rule {
        border: none;
        border-top: 3px double var(--ink);
        margin: 1.1rem 0 1.8rem;
    }

    .login-card .form-label,
    .login-card label {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-mid);
        margin-bottom: 5px;
    }

    .login-card .form-control {
        background: var(--cream-dark);
        border: 1px solid var(--rule-heavy);
        border-radius: 0;
        color: var(--ink);
        font-family: var(--font-body);
        font-size: 1rem;
        padding: 9px 12px;
        box-shadow: none;
        transition: border-color 0.15s, background 0.15s;
    }

    .login-card .form-control:focus {
        background: #fff;
        border-color: var(--ink);
        outline: none;
        box-shadow: none;
    }

    .login-card .form-text,
    .login-card small {
        font-family: var(--font-mono);
        font-size: 0.62rem;
        color: var(--ink-faint);
        letter-spacing: 0.06em;
    }

    .login-card .invalid-feedback,
    .login-card .errorlist {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        color: var(--red-ink);
        letter-spacing: 0.06em;
        list-style: none;
        padding: 0;
    }

    .btn-login {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--cream);
        background: var(--ink);
        border: 1.5px solid var(--ink);
        border-radius: 0;
        padding: 10px 28px;
        cursor: pointer;
        display: inline-block;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
        margin-top: 0.4rem;
    }

    .btn-login:hover {
        background: var(--red-ink);
        border-color: var(--red-ink);
        color: var(--cream);
    }

    .login-footer {
        margin-top: 1.6rem;
        padding-top: 1rem;
        border-top: 1px solid var(--rule);
        font-family: var(--font-mono);
        font-size: 0.65rem;
        letter-spacing: 0.1em;
        color: var(--ink-faint);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
    }

    .login-footer a {
        color: var(--ink-mid);
        text-decoration: underline;
        text-underline-offset: 3px;
        text-decoration-color: var(--rule-heavy);
        transition: color 0.15s;
    }

    .login-footer a:hover {
        color: var(--red-ink);
        text-decoration-color: var(--red-ink);
    }

    @media (max-width: 768px) {
        .login-card { padding: 2rem 1.4rem; }
        .login-heading { font-size: 1.7rem; }
    }
</style>

<div class="login-wrapper">
    <div class="login-card">
        <span class="login-kicker">New Readership</span>
        <h2 class="login-heading">Sign Up</h2>
        <hr class="login-rule">

        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button class="btn-login" type="submit">Create Account</button>
        </form>

        <div class="login-footer">
            <span>Already a member?</span>
            <a href="{% url 'login' %}">Log in to your account</a>
        </div>
    </div>
</div>

{% endblock content %}
