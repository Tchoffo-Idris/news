{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Enter New Password{% endblock title %}

{% block content %}

<style>
    .login-wrapper {
        min-height: calc(100vh - 3rem);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 3rem 1rem;
        position: relative;
    }

    .login-wrapper::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
            radial-gradient(circle at 20% 15%, rgba(139, 26, 26, 0.05) 0%, transparent 45%),
            radial-gradient(circle at 82% 85%, rgba(43, 29, 14, 0.06) 0%, transparent 45%);
        pointer-events: none;
    }

    .login-card {
        width: 100%;
        max-width: 480px;
        background: var(--cream);
        border: 1px solid var(--rule);
        border-radius: 14px;
        box-shadow: 0 24px 60px rgba(30, 20, 10, 0.14), 0 4px 14px rgba(30, 20, 10, 0.08);
        padding: 3rem 2.6rem 2.6rem;
        position: relative;
        z-index: 1;
    }

    .login-card::before {
        content: '';
        position: absolute;
        top: -1px; left: -1px;
        width: 26px; height: 26px;
        border-top: 2px solid var(--ink);
        border-left: 2px solid var(--ink);
        border-top-left-radius: 14px;
        opacity: 0.85;
    }

    .login-card::after {
        content: '';
        position: absolute;
        bottom: -1px; right: -1px;
        width: 26px; height: 26px;
        border-bottom: 2px solid var(--ink);
        border-right: 2px solid var(--ink);
        border-bottom-right-radius: 14px;
        opacity: 0.85;
    }

    .login-kicker {
        font-family: var(--font-body);
        font-style: italic;
        font-weight: 500;
        font-size: 0.72rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--red-ink);
        display: block;
        margin-bottom: 0.7rem;
        text-align: center;
    }

    .login-heading {
        font-family: var(--font-display);
        font-size: 2.1rem;
        font-weight: 900;
        color: var(--ink);
        letter-spacing: -0.03em;
        line-height: 1.1;
        margin-bottom: 0;
        text-transform: uppercase;
        text-align: center;
    }

    .login-rule {
        border: none;
        height: 1px;
        background: var(--ink);
        margin: 1.1rem auto 1.8rem;
        max-width: 110px;
        position: relative;
    }

    .login-rule::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 6px;
        height: 6px;
        background: var(--red-ink);
        transform: translate(-50%, -50%) rotate(45deg);
    }

    .login-card .form-label,
    .login-card label {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-mid);
        margin-bottom: 5px;
    }

    .login-card .form-control {
        background: var(--cream-dark);
        border: 1px solid var(--rule-heavy);
        border-radius: 8px;
        color: var(--ink);
        font-family: var(--font-body);
        font-size: 1rem;
        padding: 10px 14px;
        box-shadow: none;
        transition: border-color 0.15s, background 0.15s;
    }

    .login-card .form-control:focus {
        background: #fff;
        border-color: var(--ink);
        outline: none;
        box-shadow: 0 0 0 3px rgba(43, 29, 14, 0.08);
    }

    .login-card .form-text,
    .login-card small {
        font-family: var(--font-mono);
        font-size: 0.62rem;
        color: var(--ink-faint);
        letter-spacing: 0.06em;
    }

    .login-card .invalid-feedback,
    .login-card .errorlist {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        color: var(--red-ink);
        letter-spacing: 0.06em;
        list-style: none;
        padding: 0;
    }

    .btn-login {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--cream);
        background: var(--red-ink);
        border: 1.5px solid var(--red-ink);
        border-radius: 999px;
        padding: 12px 28px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        box-shadow: 0 4px 14px rgba(139, 26, 26, 0.25);
        transition: background 0.18s, border-color 0.18s, box-shadow 0.18s, transform 0.15s;
        margin-top: 0.6rem;
    }

    .btn-login:hover {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--cream);
        box-shadow: 0 6px 18px rgba(26, 26, 26, 0.3);
        transform: translateY(-2px);
    }

    @media (max-width: 768px) {
        .login-card { padding: 2.4rem 1.6rem 2.2rem; }
        .login-heading { font-size: 1.7rem; }
    }
</style>

<div class="login-wrapper">
    <div class="login-card">
        <span class="login-kicker">Account Security</span>
        <h1 class="login-heading">Set New Password</h1>
        <hr class="login-rule">

        <form method="POST">
            {% csrf_token %}
            {{ form|crispy }}
            <button class="btn-login" type="submit">Confirm Password</button>
        </form>
    </div>
</div>

{% endblock content %}
