{% extends "base.html" %}


{% block title %}Email Sent{% endblock title %}

{% block content %}

<style>
    .notice-wrapper {
        min-height: calc(100vh - 3rem);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 3rem 1rem;
        position: relative;
    }

    .notice-wrapper::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
            radial-gradient(circle at 20% 15%, rgba(139, 26, 26, 0.05) 0%, transparent 45%),
            radial-gradient(circle at 82% 85%, rgba(43, 29, 14, 0.06) 0%, transparent 45%);
        pointer-events: none;
    }

    .notice-card {
        width: 100%;
        max-width: 480px;
        background: var(--cream);
        border: 1px solid var(--rule);
        border-radius: 14px;
        box-shadow: 0 24px 60px rgba(30, 20, 10, 0.14), 0 4px 14px rgba(30, 20, 10, 0.08);
        padding: 3rem 2.6rem 2.6rem;
        position: relative;
        text-align: center;
        z-index: 1;
    }

    .notice-card::before {
        content: '';
        position: absolute;
        top: -1px; left: -1px;
        width: 26px; height: 26px;
        border-top: 2px solid var(--ink);
        border-left: 2px solid var(--ink);
        border-top-left-radius: 14px;
        opacity: 0.85;
    }

    .notice-card::after {
        content: '';
        position: absolute;
        bottom: -1px; right: -1px;
        width: 26px; height: 26px;
        border-bottom: 2px solid var(--ink);
        border-right: 2px solid var(--ink);
        border-bottom-right-radius: 14px;
        opacity: 0.85;
    }

    .notice-glyph-badge {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 2px solid var(--red-ink);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.2rem;
        background: var(--cream-dark);
    }

    .notice-glyph {
        font-family: var(--font-mono);
        font-size: 1.3rem;
        color: var(--red-ink);
        line-height: 1;
    }

    .notice-kicker {
        font-family: var(--font-body);
        font-style: italic;
        font-weight: 500;
        font-size: 0.72rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--red-ink);
        display: block;
        margin-bottom: 0.7rem;
    }

    .notice-heading {
        font-family: var(--font-display);
        font-size: 2rem;
        font-weight: 900;
        color: var(--ink);
        letter-spacing: -0.03em;
        line-height: 1.15;
        margin-bottom: 0;
        text-transform: uppercase;
    }

    .notice-rule {
        border: none;
        height: 1px;
        background: var(--ink);
        margin: 1.1rem auto 1.6rem;
        max-width: 90px;
        position: relative;
    }

    .notice-rule::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 6px;
        height: 6px;
        background: var(--red-ink);
        transform: translate(-50%, -50%) rotate(45deg);
    }

    .notice-body {
        font-family: var(--font-body);
        font-size: 1.05rem;
        color: var(--ink-mid);
        line-height: 1.75;
        margin-bottom: 0;
    }

    @media (max-width: 768px) {
        .notice-card { padding: 2.4rem 1.6rem 2.2rem; }
        .notice-heading { font-size: 1.6rem; }
    }
</style>

<div class="notice-wrapper">
    <div class="notice-card">
        <div class="notice-glyph-badge"><span class="notice-glyph">&#9993;</span></div>
        <span class="notice-kicker">Account Security</span>
        <h1 class="notice-heading">Check Your Inbox</h1>
        <hr class="notice-rule">
        <p class="notice-body">Instructions for resetting your password have been dispatched. Please check your email shortly.</p>
    </div>
</div>

{% endblock content %}
