{% extends "base.html" %}


{% block content %}

<style>
    .notice-wrapper {
        min-height: calc(100vh - 3rem);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 3rem 1rem;
        position: relative;
    }

    .notice-wrapper::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
            radial-gradient(circle at 20% 15%, rgba(139, 26, 26, 0.05) 0%, transparent 45%),
            radial-gradient(circle at 82% 85%, rgba(43, 29, 14, 0.06) 0%, transparent 45%);
        pointer-events: none;
    }

    .notice-card {
        width: 100%;
        max-width: 480px;
        background: var(--cream);
        border: 1px solid var(--rule);
        border-radius: 14px;
        box-shadow: 0 24px 60px rgba(30, 20, 10, 0.14), 0 4px 14px rgba(30, 20, 10, 0.08);
        padding: 3rem 2.6rem 2.6rem;
        position: relative;
        text-align: center;
        z-index: 1;
    }

    .notice-card::before {
        content: '';
        position: absolute;
        top: -1px; left: -1px;
        width: 26px; height: 26px;
        border-top: 2px solid var(--ink);
        border-left: 2px solid var(--ink);
        border-top-left-radius: 14px;
        opacity: 0.85;
    }

    .notice-card::after {
        content: '';
        position: absolute;
        bottom: -1px; right: -1px;
        width: 26px; height: 26px;
        border-bottom: 2px solid var(--ink);
        border-right: 2px solid var(--ink);
        border-bottom-right-radius: 14px;
        opacity: 0.85;
    }

    .notice-glyph-badge {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 2px solid var(--red-ink);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.2rem;
        background: var(--cream-dark);
    }

    .notice-glyph {
        font-family: var(--font-display);
        font-weight: 900;
        font-size: 1.5rem;
        color: var(--red-ink);
        line-height: 1;
    }

    .notice-kicker {
        font-family: var(--font-body);
        font-style: italic;
        font-weight: 500;
        font-size: 0.72rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--red-ink);
        display: block;
        margin-bottom: 0.7rem;
    }

    .notice-heading {
        font-family: var(--font-display);
        font-size: 2rem;
        font-weight: 900;
        color: var(--ink);
        letter-spacing: -0.03em;
        line-height: 1.15;
        margin-bottom: 0;
        text-transform: uppercase;
    }

    .notice-rule {
        border: none;
        height: 1px;
        background: var(--ink);
        margin: 1.1rem auto 1.6rem;
        max-width: 90px;
        position: relative;
    }

    .notice-rule::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 6px;
        height: 6px;
        background: var(--red-ink);
        transform: translate(-50%, -50%) rotate(45deg);
    }

    .notice-body {
        font-family: var(--font-body);
        font-size: 1.05rem;
        color: var(--ink-mid);
        line-height: 1.75;
        margin-bottom: 1.8rem;
    }

    .notice-actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
    }

    .btn-ink-outline {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-mid);
        background: transparent;
        border: 1.5px solid var(--rule-heavy);
        border-radius: 999px;
        padding: 11px 26px;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background 0.18s, color 0.18s, border-color 0.18s, transform 0.15s;
    }

    .btn-ink-outline:hover {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--cream);
        transform: translateY(-2px);
    }

    .btn-ink-danger {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--cream);
        background: var(--red-ink);
        border: 1.5px solid var(--red-ink);
        border-radius: 999px;
        padding: 11px 26px;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 14px rgba(139, 26, 26, 0.25);
        transition: background 0.18s, border-color 0.18s, box-shadow 0.18s, transform 0.15s;
    }

    .btn-ink-danger:hover {
        background: #6B0000;
        border-color: #6B0000;
        color: var(--cream);
        box-shadow: 0 6px 18px rgba(107, 0, 0, 0.3);
        transform: translateY(-2px);
    }

    @media (max-width: 768px) {
        .notice-card { padding: 2.4rem 1.6rem 2.2rem; }
        .notice-heading { font-size: 1.6rem; }
        .notice-actions { flex-direction: column; }
        .btn-ink-outline, .btn-ink-danger { width: 100%; }
    }
</style>

<div class="notice-wrapper">
    <div class="notice-card">
        <div class="notice-glyph-badge"><span class="notice-glyph">?</span></div>
        <span class="notice-kicker">Account</span>
        <h1 class="notice-heading">Log Out?</h1>
        <hr class="notice-rule">
        <p class="notice-body">
            Are you sure you want to log out?
        </p>

        <div class="notice-actions">
            <a href="#" onclick="history.back(); return false;" class="btn-ink-outline">Cancel</a>
            <form method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn-ink-danger">Yes, Log Out</button>
            </form>
        </div>
    </div>
</div>

{% endblock content %}
