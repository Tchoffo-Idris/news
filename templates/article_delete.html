{% extends "base.html" %}


{% block content %}

<style>
    .notice-wrapper {
        display: flex;
        justify-content: center;
        padding: 3rem 1rem 5rem;
    }

    .notice-card {
        width: 100%;
        max-width: 480px;
        background: var(--cream);
        border: 1px solid var(--rule-heavy);
        box-shadow: 4px 6px 0 rgba(30, 20, 10, 0.12), 1px 2px 0 rgba(30, 20, 10, 0.06);
        padding: 2.8rem 2.6rem 2.4rem;
        position: relative;
        text-align: center;
    }

    .notice-card::before {
        content: '';
        position: absolute;
        top: -3px; left: -3px;
        width: 22px; height: 22px;
        border-top: 3px solid var(--red-ink);
        border-left: 3px solid var(--red-ink);
    }

    .notice-card::after {
        content: '';
        position: absolute;
        bottom: -3px; right: -3px;
        width: 22px; height: 22px;
        border-bottom: 3px solid var(--red-ink);
        border-right: 3px solid var(--red-ink);
    }

    .notice-glyph {
        font-family: var(--font-mono);
        font-size: 1.8rem;
        color: var(--red-ink);
        display: block;
        margin-bottom: 1rem;
        opacity: 0.7;
    }

    .notice-kicker {
        font-family: var(--font-mono);
        font-size: 0.62rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--red-ink);
        display: block;
        margin-bottom: 0.5rem;
        opacity: 0.75;
    }

    .notice-heading {
        font-family: var(--font-display);
        font-size: 2rem;
        font-weight: 900;
        color: var(--ink);
        letter-spacing: -0.03em;
        line-height: 1.15;
        margin-bottom: 0;
    }

    .notice-rule {
        border: none;
        border-top: 3px double var(--ink);
        margin: 1.1rem auto 1.6rem;
        max-width: 80px;
    }

    .notice-body {
        font-family: var(--font-body);
        font-size: 1.05rem;
        color: var(--ink-mid);
        line-height: 1.75;
        margin-bottom: 1.8rem;
        font-style: italic;
    }

    .notice-body strong {
        font-style: normal;
        color: var(--ink);
        font-weight: 600;
    }

    .notice-actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
    }

    .btn-ink-danger {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--cream);
        background: var(--red-ink);
        border: 1.5px solid var(--red-ink);
        border-radius: 0;
        padding: 10px 24px;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        line-height: 1.6;
        transition: background 0.15s, border-color 0.15s;
    }

    .btn-ink-danger:hover {
        background: #6B0000;
        border-color: #6B0000;
        color: var(--cream);
    }

    .btn-ink-danger:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }

    .btn-ink-outline {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-mid);
        background: transparent;
        border: 1.5px solid var(--rule-heavy);
        border-radius: 0;
        padding: 10px 24px;
        text-decoration: none;
        display: inline-block;
        line-height: 1.6;
        transition: background 0.15s, color 0.15s;
    }

    .btn-ink-outline:hover {
        background: var(--ink-mid);
        color: var(--cream);
    }

    /* Spinner animation */
    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .btn-spinner {
        display: none;
        width: 12px;
        height: 12px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    .btn-ink-danger.loading .btn-spinner {
        display: block;
    }

    .btn-ink-danger.loading .btn-text {
        opacity: 0.8;
    }

    @media (max-width: 768px) {
        .notice-card { padding: 2rem 1.4rem; }
        .notice-heading { font-size: 1.6rem; }
    }
</style>

<div class="notice-wrapper">
    <div class="notice-card">
        <span class="notice-glyph">&#9888;</span>
        <span class="notice-kicker">Irreversible Action</span>
        <h1 class="notice-heading">Delete Article</h1>
        <hr class="notice-rule">
        <p class="notice-body">
            Are you sure you want to permanently delete<br>
            <strong>&ldquo;{{ article.title }}&rdquo;</strong>?<br>
            This cannot be undone.
        </p>

        <div class="notice-actions">
            <a href="{% url 'article_list' %}" class="btn-ink-outline">Cancel</a>
            <form action="" method="post" style="display:inline;">
                {% csrf_token %}
                <button class="btn-ink-danger" type="submit" id="deleteBtn">
                    <span class="btn-spinner"></span>
                    <span class="btn-text">Delete</span>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const deleteBtn = document.getElementById('deleteBtn');
        
        if (deleteBtn) {
            const form = deleteBtn.closest('form');
            form.addEventListener('submit', function() {
                deleteBtn.disabled = true;
                deleteBtn.classList.add('loading');
            });
        }
    });
</script>

{% endblock content %}
