{% extends "base.html" %}
{% load crispy_forms_tags %}


{% block content %}

<style>
    .form-wrapper {
        display: flex;
        justify-content: center;
        padding: 2.5rem 1rem 5rem;
    }

    .form-card {
        width: 100%;
        max-width: 780px;
        background: var(--cream);
        border: 1px solid var(--rule-heavy);
        box-shadow: 4px 6px 0 rgba(30, 20, 10, 0.12), 1px 2px 0 rgba(30, 20, 10, 0.06);
        padding: 2.8rem 2.6rem 2.4rem;
        position: relative;
    }

    .form-card::before {
        content: '';
        position: absolute;
        top: -3px; left: -3px;
        width: 22px; height: 22px;
        border-top: 3px solid var(--ink);
        border-left: 3px solid var(--ink);
    }

    .form-card::after {
        content: '';
        position: absolute;
        bottom: -3px; right: -3px;
        width: 22px; height: 22px;
        border-bottom: 3px solid var(--ink);
        border-right: 3px solid var(--ink);
    }

    .form-kicker {
        font-family: var(--font-mono);
        font-size: 0.62rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--ink-faint);
        display: block;
        margin-bottom: 0.5rem;
    }

    .form-heading {
        font-family: var(--font-display);
        font-size: 2.1rem;
        font-weight: 900;
        color: var(--ink);
        letter-spacing: -0.03em;
        line-height: 1.1;
        margin-bottom: 0;
    }

    .form-rule {
        border: none;
        border-top: 3px double var(--ink);
        margin: 1rem 0 1.8rem;
    }

    .form-card .form-label,
    .form-card label {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-mid);
        margin-bottom: 5px;
    }

    .form-card .form-control {
        background: var(--cream-dark);
        border: 1px solid var(--rule-heavy);
        border-radius: 0;
        color: var(--ink);
        font-family: var(--font-body);
        font-size: 1rem;
        padding: 9px 12px;
        box-shadow: none;
        transition: border-color 0.15s, background 0.15s;
    }

    .form-card .form-control:focus {
        background: #fff;
        border-color: var(--ink);
        outline: none;
        box-shadow: none;
    }

    /* File input */
    .form-card input[type="file"] {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        letter-spacing: 0.1em;
        color: var(--ink-mid);
        background: var(--cream-dark);
        border: 1px dashed var(--rule-heavy);
        border-radius: 0;
        padding: 10px 12px;
        width: 100%;
        cursor: pointer;
        transition: border-color 0.15s;
    }

    .form-card input[type="file"]:hover { border-color: var(--ink); }

    .form-card .form-text,
    .form-card small {
        font-family: var(--font-mono);
        font-size: 0.62rem;
        color: var(--ink-faint);
        letter-spacing: 0.06em;
    }

    .form-card .invalid-feedback,
    .form-card .errorlist {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        color: var(--red-ink);
        letter-spacing: 0.06em;
        list-style: none;
        padding: 0;
    }

    /* CKEditor border styling */
    .form-card .django-ckeditor-widget,
    .form-card .cke {
        border: 1px solid var(--rule-heavy) !important;
        border-radius: 0 !important;
    }

    .form-card .cke_top {
        background: var(--cream-dark) !important;
        border-bottom: 1px solid var(--rule) !important;
    }

    .form-card .cke_bottom {
        background: var(--cream-dark) !important;
        border-top: 1px solid var(--rule) !important;
    }

    /* Image preview */
    .image-preview-wrap { margin-top: 0.6rem; display: none; }
    .image-preview-wrap.active { display: block; }

    .image-preview {
        width: 100%;
        max-height: 220px;
        object-fit: cover;
        border: 1px solid var(--rule);
        filter: grayscale(15%);
        display: block;
    }

    .image-preview-label {
        font-family: var(--font-mono);
        font-size: 0.58rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-faint);
        margin-top: 4px;
        display: block;
    }

    .btn-submit {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--cream);
        background: var(--ink);
        border: 1.5px solid var(--ink);
        border-radius: 0;
        padding: 10px 28px;
        cursor: pointer;
        margin-top: 1.2rem;
        transition: background 0.15s, border-color 0.15s;
        display: inline-block;
    }

    .btn-submit:hover {
        background: var(--red-ink);
        border-color: var(--red-ink);
    }

    @media (max-width: 768px) {
        .form-card { padding: 2rem 1.4rem; }
        .form-heading { font-size: 1.7rem; }
    }
</style>

<div class="form-wrapper">
    <div class="form-card">
        <span class="form-kicker">Editorial Desk</span>
        <h1 class="form-heading">New Article</h1>
        <hr class="form-rule">

        <form action="" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form|crispy }}

            <div class="image-preview-wrap" id="previewWrap">
                <img src="" alt="Preview" class="image-preview" id="imagePreview">
                <span class="image-preview-label">Image preview</span>
            </div>

            <button class="btn-submit" type="submit">[+] Publish Article &rarr;</button>
        </form>
    </div>
</div>

{% block extrajs %}{{ form.media }}{% endblock %}

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const fileInput = document.querySelector('input[type="file"]');
        const preview = document.getElementById('imagePreview');
        const wrap = document.getElementById('previewWrap');

        if (fileInput) {
            fileInput.addEventListener('change', function () {
                const file = this.files[0];
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        preview.src = e.target.result;
                        wrap.classList.add('active');
                    };
                    reader.readAsDataURL(file);
                } else {
                    wrap.classList.remove('active');
                }
            });
        }
    });
</script>

{% endblock content %}
