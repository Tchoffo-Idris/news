{% comment %} 
    Modern Instagram-Style Shimmer Skeleton Loader 
    Flat 2D blocks with a sliding gradient reflection wave.
{% endcomment %}

<style>
    /* Instagram-style Shimmer Animation */
    @keyframes instagramShimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }

    #skeletonContainer {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 0 4rem;
    }

    /* FIX 1: Forced Container Layout & Layering */
    .skeleton-block {
        background-color: var(--cream-dark) !important;
        border: 1px solid var(--rule);
        margin-bottom: 1.5rem;
        position: relative !important;
        overflow: hidden !important;
        z-index: 1;
    }

    /* FIX 2: Forced Shimmer Overlay Layering */
    .skeleton-block::after {
        content: "" !important;
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        display: block !important;
        z-index: 2 !important;
        background: linear-gradient(
            90deg, 
            rgba(255, 255, 255, 0) 0%, 
            rgba(255, 255, 255, 0.4) 20%, 
            rgba(255, 255, 255, 0.6) 60%, 
            rgba(255, 255, 255, 0) 100%
        ) !important;
        animation: instagramShimmer 1.6s infinite linear !important;
    }

    /* Hero section placeholder */
    .skeleton-hero {
        width: 100%;
        height: 480px;
        margin-bottom: 2rem;
    }

    /* 3-column row placeholder */
    .skeleton-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
        width: 100%;
    }

    .skeleton-card {
        height: 320px;
        border-right: 1px solid var(--rule);
        padding-right: 1.2rem;
    }

    .skeleton-card:last-child {
        border-right: none;
        padding-right: 0;
    }

    /* Image placeholder class to replace inline height */
    .skeleton-img-placeholder {
        height: 180px;
    }

    .skeleton-line {
        height: 12px;
        width: 80%;
        margin-top: 1rem;
    }

    .skeleton-line-sm {
        height: 8px;
        width: 40%;
        margin-top: 0.5rem;
    }

    @media (max-width: 960px) {
        .skeleton-grid { grid-template-columns: 1fr 1fr; }
        .skeleton-hero { height: 300px; }
        .skeleton-card:nth-child(2) { border-right: none; }
    }

    @media (max-width: 600px) {
        .skeleton-grid { grid-template-columns: 1fr; }
        .skeleton-card { border-right: none; padding-right: 0; border-bottom: 1px solid var(--rule); padding-bottom: 1rem; }
    }
</style>

<div id="skeletonContainer">
    <!-- Hero Wrapper Section -->
    <div class="skeleton-block skeleton-hero"></div>
    
    <!-- 3-Column Post Preview Cards -->
    <div class="skeleton-grid">
        <div class="skeleton-card">
            <div class="skeleton-block skeleton-img-placeholder"></div>
            <div class="skeleton-block skeleton-line"></div>
            <div class="skeleton-block skeleton-line-sm"></div>
        </div>
        <div class="skeleton-card">
            <div class="skeleton-block skeleton-img-placeholder"></div>
            <div class="skeleton-block skeleton-line"></div>
            <div class="skeleton-block skeleton-line-sm"></div>
        </div>
        <div class="skeleton-card">
            <div class="skeleton-block skeleton-img-placeholder"></div>
            <div class="skeleton-block skeleton-line"></div>
            <div class="skeleton-block skeleton-line-sm"></div>
        </div>
    </div>
</div>
